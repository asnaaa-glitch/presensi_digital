<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#3b82f6" />
<title>Masuk — Presensi Kelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="particles" id="particles"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-mark"><i class="fa-solid fa-qrcode"></i></div>
    <h1>Presensi Kelas</h1>
    <p class="sub">Masuk untuk membuka dashboard scan &amp; rekap kehadiran.</p>

    <form id="loginForm">
      <div class="auth-field">
        <label for="loginUser">Username</label>
        <div class="nim-field">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="loginUser" placeholder="Masukkan username" autocomplete="username" required>
        </div>
      </div>
      <div class="auth-field">
        <label for="loginPass">Password</label>
        <div class="nim-field">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPass" placeholder="Masukkan password" autocomplete="current-password" required>
        </div>
      </div>

      <div class="auth-error" id="loginError">
        <i class="fa-solid fa-circle-exclamation"></i> Username atau password salah.
      </div>

      <button type="submit" class="btn btn-main btn-block auth-submit">
        <i class="fa-solid fa-right-to-bracket"></i><span>Masuk Sistem</span>
      </button>
    </form>

    <div class="auth-demo">
      <p>AKUN DEMO — klik untuk isi otomatis</p>
      <div class="auth-demo-list" id="demoList"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
